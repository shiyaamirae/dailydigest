name: Daily Digest

on:
  schedule:
    - cron: "30 3 * * *" # 9:00 AM IST — not minute-precise, can slip under load
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch candidates
        run: python pipeline/fetch.py

      - name: Rank and summarize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pipeline/rank_summarize.py

      - name: Publish digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python pipeline/publish.py

      - name: Wait for Vercel deploy
        run: sleep 45

      - name: Notify via ntfy.sh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s \
            -H "Title: AI24 — today's digest is up" \
            -H "Tags: newspaper" \
            -d "Fresh AI / Design / Voice AI picks are live." \
            "https://ntfy.sh/$NTFY_TOPIC"
